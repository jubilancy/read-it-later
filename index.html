<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reading List</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 My Reading List</h1>
      <p class="stats">1 article saved &mdash; last updated May 10, 2026</p>
    </header>

    <input id="search" type="search" placeholder="🔍 Search articles…" autocomplete="off">

    <div class="articles-grid">
      
    <article class="article-card">
      
      <h2 class="article-title">
        <a href="#">https://rateyourmusic.com/artist/marcoca</a>
      </h2>
      <div class="article-meta">📅 May 09, 2026</div>
      <p class="article-excerpt"></p>
      <div class="tags"></div>
    </article>
    </div>
  </div>

  <script>
const input = document.getElementById('search');
const cards = document.querySelectorAll('.article-card');

input.addEventListener('input', () => {
  const q = input.value.trim().toLowerCase();
  let visible = 0;
  cards.forEach(card => {
    const text = card.textContent.toLowerCase();
    const show = !q || text.includes(q);
    card.style.display = show ? '' : 'none';
    if (show) visible++;
  });

  let empty = document.querySelector('.empty');
  if (!empty) {
    empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = 'No articles match your search.';
    document.querySelector('.articles-grid').appendChild(empty);
  }
  empty.style.display = (!q || visible) ? 'none' : '';
});
</script>
</body>
</html>
