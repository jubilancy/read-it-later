name: Save Article & Build Site

permissions:
  contents: write

on:
  workflow_dispatch:
  repository_dispatch:
    types: [new-url]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Save payload and extract article metadata
        run: |
          echo '${{ toJson(github.event) }}' > payload.json
          python extract.py

      - name: Build HTML site
        run: python generate_site.py

      - name: Commit metadata back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force add metadata.json even if ignored
          if [ -f "metadata.json" ]; then
            git add -f metadata.json
            git diff --staged --quiet || git commit -m "chore: update article metadata [skip ci]"
            git push origin main
          else
            echo "No metadata.json to commit"
          fi

      - name: Deploy site to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Remove payload.json to avoid conflicts
          rm -f payload.json

          # Stash the built site somewhere safe
          cp -r site /tmp/site-deploy

          # Switch to (or create) gh-pages
          git fetch origin gh-pages 2>/dev/null || true
          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi

          # Wipe everything and replace with built site
          git rm -rf . 2>/dev/null || true
          cp -r /tmp/site-deploy/* .
          touch .nojekyll

          git add -A
          git diff --staged --quiet || git commit -m "deploy: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin gh-pages --force
